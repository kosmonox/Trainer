name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npx vite build

      - name: Add Android platform
        run: |
          set +e
          yes | npx cap add android --verbose > add-android.log 2>&1
          echo "EXIT_CODE=$?" >> add-android.log
          cat add-android.log

      - name: Save debug log if something went wrong
        if: always()
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add -f add-android.log
          git commit -m "Debug log [skip ci]" || echo "nothing to commit"
          git push || echo "push failed"

      - name: Check add-android actually succeeded
        run: test -d android

      - name: Sync Capacitor
        run: npx cap sync android --verbose

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ApneaTrainer-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npx vite build

      - name: Add Android platform
        run: yes | npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply custom app icon
        run: |
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$density
            cp icons/mipmap-$density/*.png android/app/src/main/res/mipmap-$density/
          done
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cp icons/mipmap-anydpi-v26/*.xml android/app/src/main/res/mipmap-anydpi-v26/

      - name: Apply custom splash screen
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp splash/splash.png android/app/src/main/res/drawable/splash.png

      - name: Apply custom native plugin (MEDIA-usage haptics)
        run: |
          PKG_DIR=android/app/src/main/java/com/apneatrainer/app
          mkdir -p "$PKG_DIR"
          cp native/MediaHapticsPlugin.java "$PKG_DIR/"
          cp native/MainActivity.java "$PKG_DIR/"

      - name: Set up signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/apnea-release.keystore
          cat >> android/app/build.gradle << 'GRADLEEOF'

android {
    signingConfigs {
        release {
            storeFile file('apnea-release.keystore')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias System.getenv('KEY_ALIAS')
            keyPassword System.getenv('KEY_PASSWORD')
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            signingConfig signingConfigs.release
        }
    }
}
GRADLEEOF

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +e
          ./gradlew assembleDebug --stacktrace > ../gradle-build.log 2>&1
          echo "EXIT_CODE=$?" >> ../gradle-build.log
          tail -80 ../gradle-build.log

      - name: Commit build log for diagnosis
        if: always()
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          tail -120 gradle-build.log > build-error.log || true
          git add -f build-error.log
          git commit -m "Build diagnostics [skip ci]" || echo "nothing to commit"
          git push || echo "push failed"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ApneaTrainer-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: On failure, commit gradle log for debugging
        if: failure()
        run: |
          find android -iname "*.log" -o -iname "*.txt" -path "*build/reports*" | head -5
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add -f android/app/build/outputs/logs 2>/dev/null || true
          git commit -m "Debug artifacts [skip ci]" || echo "nothing to commit"
          git push || echo "push failed"

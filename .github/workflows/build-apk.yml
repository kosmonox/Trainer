name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npx vite build

      - name: Add Android platform
        run: yes | npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply custom app icon
        run: |
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$density
            cp icons/mipmap-$density/*.png android/app/src/main/res/mipmap-$density/
          done
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cp icons/mipmap-anydpi-v26/*.xml android/app/src/main/res/mipmap-anydpi-v26/

      - name: Apply custom splash screen
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp splash/splash.png android/app/src/main/res/drawable/splash.png

      - name: Apply custom native plugin (MEDIA-usage haptics)
        run: |
          PKG_DIR=android/app/src/main/java/com/apneatrainer/app
          mkdir -p "$PKG_DIR"
          cp native/MediaHapticsPlugin.java "$PKG_DIR/"
          cp native/MainActivity.java "$PKG_DIR/"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ApneaTrainer-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: On failure, commit gradle log for debugging
        if: failure()
        run: |
          find android -iname "*.log" -o -iname "*.txt" -path "*build/reports*" | head -5
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add -f android/app/build/outputs/logs 2>/dev/null || true
          git commit -m "Debug artifacts [skip ci]" || echo "nothing to commit"
          git push || echo "push failed"
